<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
</head>
<body>
<h2>Welcome, <span id="username">Caricamento...</span></h2>
<img id="avatar" src="" width="100" style="display:none; border-radius: 50%;"/>
<br>
<a href="/logout">Logout</a>

<script>
    fetch('/user-info')
        .then(response => response.json())
        .then(data => {
            document.getElementById('username').innerText = data.name;

            const img = document.getElementById('avatar');
            img.src = data.avatar;
            img.style.display = 'block';
        })
        .catch(error => console.error('Errore:', error));
</script>
</body>
</html>
